name: Publish shorts
on:
  workflow_dispatch:
  push:
    paths:
      - "incoming/manifest.json"
      - ".github/workflows/publish-shorts.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified media and publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path("incoming")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No incoming/manifest.json yet")
              sys.exit(0)
          manifest = json.loads(manifest_path.read_text())
          out = pathlib.Path("shorts")
          out.mkdir(exist_ok=True)
          ready = []
          for name, meta in manifest["files"].items():
              parts_dir = root / f"{name}.b64.d"
              expected = meta["parts"]
              parts = sorted(parts_dir.glob("part-*")) if parts_dir.is_dir() else []
              if len(parts) < expected:
                  print(f"SKIP {name}: {len(parts)}/{expected} parts")
                  continue
              data = b"".join(p.read_bytes() for p in parts)
              # parts are ascii base64; decode
              import base64, re
              text = b"".join(p.read_bytes() for p in parts).decode("ascii")
              text = re.sub(r"\s+", "", text)
              raw = base64.b64decode(text, validate=False)
              digest = hashlib.sha256(raw).hexdigest()
              if digest != meta["sha256"] or len(raw) != meta["bytes"]:
                  print(f"SKIP {name}: hash or size mismatch (got {digest} {len(raw)} bytes)")
                  continue
              dest = out / name
              dest.write_bytes(raw)
              print(f"OK {name} ({len(raw)} bytes)")
              ready.append(dest)
          if not ready:
              print("No complete verified MP4s to publish")
              sys.exit(0)
          names = [str(p) for p in ready]
          view = subprocess.run(["gh", "release", "view", "shorts"], capture_output=True)
          if view.returncode == 0:
              subprocess.check_call(["gh", "release", "upload", "shorts", *names, "--clobber"])
          else:
              subprocess.check_call([
                  "gh", "release", "create", "shorts", *names,
                  "--title", "Route Stories Shorts",
                  "--notes", "Public media for Route Stories social posts",
              ])
          print("Published", ", ".join(p.name for p in ready))
          PY
